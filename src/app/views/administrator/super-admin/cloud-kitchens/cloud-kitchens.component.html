<div class="grid-container">
	<div class="top">
		<div class="container">
			<div class="grid-container-toolbar">
				<div class="view-toggle">
					<div class="btn-group btn-group-sm" role="group" aria-label="Kitchen assignment filter">
						<input type="radio" class="btn-check" name="btnradio" id="btnradio1" autocomplete="off" [checked]="empStatus() === 'assigned'" (change)="setEmpStatus('assigned')">
						<label class="btn" [ngClass]="empStatus() === 'assigned' ? 'btn-primary' : 'btn-outline-secondary'" for="btnradio1">
							<i class="fa-solid fa-user-check me-1"></i>
							Assigned
						</label>

						<input type="radio" class="btn-check" name="btnradio" id="btnradio2" autocomplete="off" [checked]="empStatus() === 'not-assigned'" (change)="setEmpStatus('not-assigned')">
						<label class="btn" [ngClass]="empStatus() === 'not-assigned' ? 'btn-primary' : 'btn-outline-secondary'" for="btnradio2">
							<i class="fa-regular fa-circle-xmark me-1"></i>
							Not Assigned
						</label>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="middle">
		<div class="container">
			<ul class="default-item-list">
				@for (item of list(); track item.kitchen_id) {
				<li class="default-item-card">
					<div class="info">
						<div class="name">{{ item.kitchen_id }}</div>
						<div class="position text-capitalize">
							{{ item.city }}, {{ item.state }}
						</div>

						<div class="meta">
							<span class="meta-item">Pincode: {{ item.pincode }}</span>
							<span class="meta-item">
								Assigned: {{ item.assigned ? 'Yes' : 'No' }}
							</span>
							<span class="meta-item">
								Status: {{ item.status }}
							</span>
						</div>
					</div>

					<div class="actions">
						<button type="button" class="btn btn-sm btn-outline-primary">
							<i class="fa-regular fa-eye"></i> View
						</button>
						<button type="button" class="btn btn-sm btn-outline-secondary">
							<i class="fa-regular fa-pen-to-square"></i> Edit
						</button>
					</div>
				</li>
				} @empty {
				<li class="default-item-empty">
					<div class="text-muted text-center py-4">
						No results found
					</div>
				</li>
				}
			</ul>
		</div>
	</div>




	<div class="bottom" *ngIf="totalItems() > 0">
		<!-- <hr class="mt-0" /> -->
		<div class="container">
			<app-pagination [totalRecords]="totalItems()" [currentPage]="page()" [recordsPerPage]="size()" [pageSizeList]="pageSizes" (onPageChange)="setPage($event)" (onPageSizeChange)="setSize($event)">
			</app-pagination>
		</div>
	</div>



	<div style="    position: fixed;
    right: 1rem;
    bottom: 85px;
    background-color: #ffffff;
    border-radius: 100%;
    box-shadow: 0 0 40px #000000;">

		<button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon button with a vertical three dot icon">
			<mat-icon>more_vert</mat-icon>
		</button>

		<mat-menu #menu="matMenu">
			<button mat-menu-item>
				<mat-icon>dialpad</mat-icon>
				<span>Redial</span>
			</button>
			<button mat-menu-item disabled>
				<mat-icon>voicemail</mat-icon>
				<span>Check voice mail</span>
			</button>
			<button mat-menu-item>
				<mat-icon>notifications_off</mat-icon>
				<span>Disable alerts</span>
			</button>
		</mat-menu>
	</div>
</div>
