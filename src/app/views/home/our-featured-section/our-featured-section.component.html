<div class="container-fluid">
	<h4 class="mb-3 text-center subTitle">Top Picks for You</h4>
	<h2 class="mb-3 text-center title">Our Featured</h2>
	<div class="titleBorder">
		<div class="linebar"></div>
		<div class="dot"></div>
		<div class="linebar"></div>
	</div>

	<div class="carousel-wrapper">
		<button class="carousel-btn carousel-btn--left" (click)="slideLeft()">
			‹
		</button>

		<div class="carousel-container">
			<div class="carousel-track">
				@for (item of getVisibleItems(); track item.index) {
				<div class="carousel-slide" [class.carousel-slide--offset-2]="item.offset === -2" [class.carousel-slide--offset-1]="item.offset === -1" [class.carousel-slide--offset-0]="item.offset === 0" [class.carousel-slide--offset-1-right]="item.offset === 1" [class.carousel-slide--offset-2-right]="item.offset === 2" [style.transform]="getTransform(item.offset)" [style.filter]="getOpacityFilter(item.offset)" (click)="goToItem(item.index)" [style.cursor]="item.offset === 0 ? 'default' : 'pointer'">


					<div class="menuItem">
						<div class="item-image">
							<img [src]="item.item.image_url" loading="lazy" [title]="item.item.name" [alt]="item.item.name" />
							<div class="item-header">
								<div class="item-heading-rating">
									<h3 class="item-name">{{item.item.name}}</h3>
									<span class="item-rating">
										{{item.item.rating}}
										<span class="item-star">★</span>
									</span>
								</div>
							</div>


						</div>
						<div class="item-body">
							<div class="item-meta">
								<span class="item-description">{{item.item.description}}</span>
							</div>

							<div class="item-price">
								<div class="d-flex flex-column">
									<div class="item-footer align-items-center">
										<span class="item-address"><i class="fa-solid fa-location-dot"></i> {{item.item.address}}</span>
									</div>
								</div>
								<div class="d-flex align-items-end flex-column">
									<div class="finalPrice">
										<i class="fa-solid fa-indian-rupee-sign"></i>
										<span>{{item.item.base_price}}</span>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				}
			</div>
		</div>

		<button class="carousel-btn carousel-btn--right" (click)="slideRight()">
			›
		</button>
	</div>

	<div class="carousel-dots">
		@for (item of ourFeaturedList(); track $index) {
		<button class="carousel-dot" [class.carousel-dot--active]="$index === currentIndex" (click)="currentIndex = $index"></button>
		}
	</div>
</div>
