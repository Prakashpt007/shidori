@if(pages() == 1){
<div class="page page-1">
	<h4>Page 1</h4>
	<button type="button" class="pill btn btn-lg btn-secondary pill--light right" (click)="pages.set(2)">Next <i class="fa-solid fa-arrow-right-long"></i></button>
</div>
}
@if(pages() == 2){
<div class="page page-2">
	<h4>Page 2</h4>
	<button type="button" class="pill btn btn-lg btn-secondary pill--light left" (click)="pages.set(1)"><i class="fa-solid fa-arrow-left-long"></i> Prev</button>
	<button type="button" class="pill btn btn-lg btn-secondary pill--light right" (click)="pages.set(3)">Next <i class="fa-solid fa-arrow-right-long"></i></button>
</div>
}
@if(pages() == 3){
<div class="page page-3">
	<h4>Page 3</h4>
	<button type="button" class="pill btn btn-lg btn-secondary pill--light left" (click)="pages.set(2)"><i class="fa-solid fa-arrow-left-long"></i> Prev</button>
	<button type="button" class="pill btn btn-lg btn-secondary pill--light right" (click)="pages.set(4)">Next <i class="fa-solid fa-arrow-right-long"></i></button>
</div>
}
@if(pages() == 4){
<div class="page page-4">
	<h4>Page 4</h4>
	<button type="button" class="pill btn btn-lg btn-secondary pill--light left" (click)="pages.set(3)"><i class="fa-solid fa-arrow-left-long"></i> Prev</button>
	<button type="button" class="pill btn btn-lg btn-secondary pill--light right" (click)="submit()">Submit <i class="fa-solid fa-arrow-right-long"></i></button>
</div>
}

<ul class="onboarding-dots">

	@for (item of [1, 2, 3, 4]; track $index) {
	<li class="active" [ngClass]="{'active': pages() == item}"></li>
	}

</ul>
