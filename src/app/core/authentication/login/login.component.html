<div class="container centerView">

	<form [formGroup]="loginForm" class="authForm">
		<h4 class="mb-3">Login Form</h4>
		<div class="form-floating mb-3">
			<input type="email" class="form-control" formControlName="email" placeholder="email">
			<label for="floatingInput">Email</label>
		</div>


		<div class="mt-3">
			<div class="textWithHorizontalLine mb-2">
				<span>Login with :</span>
				<span class="line"></span>
			</div>
			<div class="mb-3">
				<div class="form-check form-check-inline">
					<input class="form-check-input" type="radio" formControlName="authType" id="inlineRadio1" [value]="true">
					<label class="form-check-label" for="inlineRadio1">OTP</label>
				</div>
				<div class="form-check form-check-inline">
					<input class="form-check-input" type="radio" formControlName="authType" id="inlineRadio2" [value]="false">
					<label class="form-check-label" for="inlineRadio2">Password</label>
				</div>
			</div>
		</div>


		@if(loginForm.controls['authType'].value==false){
		<div>
			<div class="form-floating mb-3">
				<input type="password" class="form-control" formControlName="password" placeholder="**********">
				<label for="floatingInput">Password</label>
			</div>


			<hr />
			<div class="text center">
				<button type="submit" class="btn btn-primary">Submit</button>
			</div>
		</div>
		} @else{
		<div class="text center">
			<button type="button" class="btn btn-primary">Send OTP</button>
			<p class="mt-2 mb-0 muted-text"><strong>Note:</strong> OTP will be sent to registered email address.</p>
		</div>
		}

		<!-- {{ loginForm.controls['email'].value }}
		{{ loginForm.controls['authType'].value }} -->
	</form>


</div>
