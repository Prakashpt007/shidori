<div style="display: flex;width: 100%;justify-content: space-evenly;">

	<div class="col leftPanel" style="background-image: url('../assets/images/bg/bg-5.jpg');">

		<h4 style="color: #ffffff;
    /* font-style: italic; */
    font-size: 5rem;text-align: center;text-shadow: 2px 3px 3px rgb(0 0 0 / 60%);margin-top: 5rem;
	/* font-family: var(--highlight-form-family); */
    font-weight: 300;">Food isn’t just food <br>it’s a feeling..!</h4>
	</div>
	<div class="col rightPanel centerView">
		<div class="background-image"></div>
		<div style="z-index: 2;margin: 2rem;">
			<h2 style="color: #ffffff;font-size: 3rem;text-align: center;margin-bottom: 2rem;text-shadow: 2px 3px 3px rgb(0 0 0 / 60%);">Welcome to the Shidori</h2>
			<form [formGroup]="registrationForm" class="authForm" (ngSubmit)="formSubmit()">
				<h4 class="mb-4">Sign Up Now</h4>
				<div class="form-floating mb-3">
					<input type="text" class="form-control" formControlName="name" placeholder="Full Name">
					<label for="floatingInput">Full Name</label>
				</div>

				<div class="form-floating mb-3">
					<input type="email" class="form-control" formControlName="email" placeholder="email">
					<label for="floatingInput">Email</label>
				</div>



				<div class="form-floating mb-3">
					<input type="tel" class="form-control" formControlName="phone" placeholder="phone">
					<label for="floatingInput">Phone</label>
				</div>


				<div class="form-floating mb-3">
					<input type="date" class="form-control" formControlName="dob" placeholder="Date of birth">
					<label for="floatingInput">Date of birth</label>
				</div>

				<hr style="border-color: #ffffff;" />

				<div class="d-flex justify-content-between align-items-center">
					<button type="submit" class="btn btn-primary">Submit</button>
					<div class="impTextLink">Already registered? <a [routerLink]="['/login']" class="custom-link">Back to Login</a></div>
				</div>
			</form>
		</div>
	</div>
</div>
