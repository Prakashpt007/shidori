<svg width="1440" height="720" viewBox="0 0 1440 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="foodGrad1" cx="0.5" cy="0.3" r="0.4">
      <stop offset="0%" stop-opacity="0.3" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-opacity="0.1" stop-color="#ffa500"/>
      <stop offset="100%" stop-opacity="0" stop-color="#ff4500"/>
    </radialGradient>
    <radialGradient id="foodGrad2" cx="0.8" cy="0.7" r="0.3">
      <stop offset="0%" stop-opacity="0.2" stop-color="#ffd700"/>
      <stop offset="50%" stop-opacity="0.1" stop-color="#ff8c00"/>
      <stop offset="100%" stop-opacity="0" stop-color="#ff6347"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
    </filter>
  </defs>
  <!-- Subtle pizza slice -->
  <g transform="translate(200, 150) scale(0.8)" filter="url(#blur)">
    <circle cx="0" cy="0" r="60" fill="url(#foodGrad1)"/>
    <path d="M 0 -50 L 50 30 L -50 30 Z" fill="#ff4500" opacity="0.6"/>
    <circle cx="20" cy="-20" r="8" fill="#fff" opacity="0.8"/>
    <circle cx="-15" cy="10" r="6" fill="#fff" opacity="0.7"/>
  </g>
  <!-- Noodles bowl hint -->
  <g transform="translate(900, 400) scale(0.6)" filter="url(#blur)">
    <ellipse cx="0" cy="0" rx="70" ry="40" fill="url(#foodGrad2)" opacity="0.4"/>
    <path d="M -50 0 Q 0 20 50 0" stroke="#ffdbac" stroke-width="4" fill="none" opacity="0.7"/>
    <circle cx="-20" cy="-15" r="12" fill="#ff8c00" opacity="0.5"/>
  </g>
  <!-- Floating dots for delivery vibe -->
  <circle cx="300" cy="200" r="15" fill="#ffd700" opacity="0.3">
    <animate attributeName="cy" values="200;180;200" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="500" r="12" fill="#ff6b6b" opacity="0.25">
    <animate attributeName="cy" values="500;480;500" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
